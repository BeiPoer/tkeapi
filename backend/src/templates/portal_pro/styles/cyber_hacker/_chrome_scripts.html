<script>
  (function () {
    const LANG_KEY = 'lang';
    const LANG_INDEXES = { zh: 0, en: 1 };

    function normalizeLang(lang) {
      if (!lang) return 'zh';
      lang = String(lang).toLowerCase();
      if (lang.startsWith('en')) return 'en';
      return 'zh';
    }

    function updateLangButton(lang) {
      const label = document.getElementById('lang-toggle-label');
      const btn = document.getElementById('lang-toggle');
      // 显示当前语言：中文页为「中」，英文页为「EN」
      if (label) label.textContent = lang === 'zh' ? '中' : 'EN';
      if (btn) {
        btn.title = lang === 'zh' ? '当前：中文，点击切换 English' : 'Current: English, click for 中文';
        btn.setAttribute('aria-label', btn.title);
        // 中 / EN 均为当前语种指示，始终高亮
        btn.classList.add('active');
      }
    }

    function ensureLangStableButton(el) {
      if (!el.classList.contains('btn-lang-stable')) return;
      const raw = el.getAttribute('data-i18n-dynamic') || '';
      if (!raw.includes('|')) return;

      let label = el.querySelector('.btn-lang-label');
      if (!label) {
        label = document.createElement('span');
        label.className = 'btn-lang-label';
        label.textContent = el.textContent.trim();
        el.textContent = '';
        el.appendChild(label);
      }

      let measure = el.querySelector('.btn-lang-measure');
      if (!measure) {
        measure = document.createElement('span');
        measure.className = 'btn-lang-measure';
        measure.setAttribute('aria-hidden', 'true');
        raw.split('|').forEach((part) => {
          const t = part.trim();
          if (!t) return;
          const span = document.createElement('span');
          span.textContent = t;
          measure.appendChild(span);
        });
        el.appendChild(measure);
      }
    }

    function setDynamicText(el, translated) {
      ensureLangStableButton(el);
      const label = el.querySelector('.btn-lang-label');
      if (label) {
        label.textContent = translated;
      } else {
        el.textContent = translated;
      }
    }

    function applyDynamicPipeLabels(lang) {
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
      document.querySelectorAll('[data-i18n-dynamic]').forEach((el) => {
        const text = el.getAttribute('data-i18n-dynamic') || el.textContent.trim();
        if (!text.includes('|')) return;
        const parts = text.split('|');
        const idx = LANG_INDEXES[lang] || 0;
        setDynamicText(el, (parts[idx] || parts[0] || text).trim());
      });
    }

    function applyCyberLanguage(rawLang) {
      const lang = normalizeLang(rawLang);
      localStorage.setItem(LANG_KEY, lang);
      updateLangButton(lang);

      // 子页走门户 base 的完整 i18n；赛博首页仅有 data-i18n-dynamic
      if (typeof window.applyLanguage === 'function') {
        window.applyLanguage(lang);
        // base 可能用 innerHTML 覆盖按钮，重新挂宽度占位
        document.querySelectorAll('.btn-lang-stable[data-i18n-dynamic]').forEach((el) => {
          const text = el.getAttribute('data-i18n-dynamic') || '';
          if (!text.includes('|')) return;
          const parts = text.split('|');
          const idx = LANG_INDEXES[lang] || 0;
          // 若被打成纯文本，重建结构
          if (!el.querySelector('.btn-lang-label')) {
            const cur = el.textContent.trim();
            el.textContent = '';
            const label = document.createElement('span');
            label.className = 'btn-lang-label';
            label.textContent = cur || (parts[idx] || parts[0] || '').trim();
            el.appendChild(label);
          }
          ensureLangStableButton(el);
          setDynamicText(el, (parts[idx] || parts[0] || '').trim());
        });
      } else {
        applyDynamicPipeLabels(lang);
        window.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang } }));
      }
    }

    window.applyCyberLanguage = applyCyberLanguage;
    window.changeLang = function (lang) {
      applyCyberLanguage(lang);
    };

    const saved = normalizeLang(localStorage.getItem(LANG_KEY) || 'zh');
    updateLangButton(saved);
    if (typeof window.applyLanguage !== 'function') {
      applyDynamicPipeLabels(saved);
    } else {
      document.querySelectorAll('.btn-lang-stable[data-i18n-dynamic]').forEach(ensureLangStableButton);
    }

    const langToggle = document.getElementById('lang-toggle');
    if (langToggle) {
      langToggle.addEventListener('click', function () {
        const cur = normalizeLang(localStorage.getItem(LANG_KEY) || 'zh');
        applyCyberLanguage(cur === 'zh' ? 'en' : 'zh');
      });
    }

    const canvas = document.getElementById('matrix-canvas');
    const matrixToggle = document.getElementById('matrix-toggle');
    if (canvas && canvas.getContext && !canvas.dataset.matrixBound) {
      canvas.dataset.matrixBound = '1';
      const ctx = canvas.getContext('2d');
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const chars = 'TOKENSBYTE010101';
      let drops = Array(Math.max(1, Math.floor(canvas.width / 14))).fill(1);
      function draw() {
        ctx.fillStyle = 'rgba(3, 5, 4, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff66';
        ctx.font = '14px monospace';
        drops.forEach((y, i) => {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * 14, y * 14);
          if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        });
      }
      setInterval(draw, 40);

      if (matrixToggle) {
        matrixToggle.addEventListener('click', function () {
          const active = this.classList.toggle('active');
          canvas.style.display = active ? 'block' : 'none';
        });
      }
    }
  })();
</script>

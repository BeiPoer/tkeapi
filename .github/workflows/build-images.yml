name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libssl-dev pkg-config

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Cache amd64 backend binary
        uses: actions/cache@v4
        with:
          path: backend/tokensbyte-server
          key: tokensbyte-backend-bin-v2-${{ hashFiles('backend/src/**', 'backend/build.rs', 'backend/Cargo.toml', 'backend/Cargo.lock', 'frontend/src/pages/Plugins/SitePortal/locales/portal/**', 'frontend/src/pages/Plugins/SitePortal/whats-token-homepage.html') }}

      - name: Validate backend manifest
        run: |
          cargo metadata --manifest-path backend/Cargo.toml --locked --no-deps --format-version 1 > /tmp/tokensbyte-backend-metadata.json
          test -s /tmp/tokensbyte-backend-metadata.json

      - name: Prepare amd64 backend binary
        run: |
          if [ -x backend/tokensbyte-server ]; then
            echo "using cached amd64 backend binary"
          else
            echo "backend binary cache miss; building from the checked-out source"
            free -h
            rustup component add rustc-codegen-cranelift-preview --toolchain nightly
            cat > "$RUNNER_TEMP/serial-rustc" <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            exec flock "${RUNNER_TEMP:-/tmp}/tokensbyte-rustc.lock" "$@"
            EOF
            chmod +x "$RUNNER_TEMP/serial-rustc"
            export RUSTC_WRAPPER="$RUNNER_TEMP/serial-rustc"
            export CARGO_INCREMENTAL=0
            export CARGO_PROFILE_RELEASE_CODEGEN_BACKEND=cranelift
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1024
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=0
            export CARGO_PROFILE_RELEASE_LTO=false
            export CARGO_PROFILE_RELEASE_DEBUG=false
            export RUSTFLAGS="-Zthreads=1 -Zmir-opt-level=0 -Zinline-mir=false -C codegen-units=1024 -C opt-level=0 -C debuginfo=0 -C panic=abort -C linker=clang -C link-arg=-fuse-ld=lld"
            set +e
            cargo +nightly -Zcodegen-backend build \
              --manifest-path backend/Cargo.toml \
              --release --locked --config unstable.codegen-backend=true --bin tokensbyte-server -j 1 &
            build_pid=$!
            while kill -0 "$build_pid" 2>/dev/null; do
              sleep 30
              if kill -0 "$build_pid" 2>/dev/null; then
                echo "backend build still running ($(date -u '+%Y-%m-%dT%H:%M:%SZ'))"
                free -h
              fi
            done
            wait "$build_pid"
            build_status=$?
            set -e
            if [ "$build_status" -ne 0 ]; then
              exit "$build_status"
            fi
            cp backend/target/release/tokensbyte-server backend/tokensbyte-server
          fi
          test -x backend/tokensbyte-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/tokensbyte-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.thin
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tokensbyte-backend
          cache-to: type=gha,mode=max,scope=tokensbyte-backend

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/tokensbyte-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tokensbyte-frontend
          cache-to: type=gha,mode=max,scope=tokensbyte-frontend

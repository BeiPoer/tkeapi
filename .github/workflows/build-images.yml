name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libssl-dev pkg-config

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Cache amd64 backend binary
        id: backend-binary-cache
        uses: actions/cache@v4
        with:
          path: backend/tokensbyte-server
          key: tokensbyte-backend-bin-v2-${{ hashFiles('backend/src/**', 'backend/build.rs', 'backend/Cargo.toml', 'backend/Cargo.lock', 'frontend/src/pages/Plugins/SitePortal/locales/portal/**', 'frontend/src/pages/Plugins/SitePortal/whats-token-homepage.html') }}

      - name: Validate backend manifest
        run: |
          cargo metadata --manifest-path backend/Cargo.toml --locked --no-deps --format-version 1 > /tmp/tokensbyte-backend-metadata.json
          test -s /tmp/tokensbyte-backend-metadata.json

      - name: Prepare memory for backend build
        if: steps.backend-binary-cache.outputs.cache-hit != 'true'
        run: |
          for sdk_path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/share/swift \
            /opt/az \
            /usr/local/aws-cli; do
            if [ -e "$sdk_path" ]; then
              sudo rm -rf -- "$sdk_path"
            fi
          done
          sudo apt-get clean
          sudo docker system prune --all --force >/dev/null 2>&1 || true

          # The monolithic backend crate peaks near 46 GiB of virtual memory.
          target_swap_kib=$((36 * 1024 * 1024))
          minimum_swap_kib=$((32 * 1024 * 1024))
          created_swap_kib=0

          create_swap_file() {
            local swap_dir="$1"
            local swap_name="$2"
            local reserve_kib="$3"
            local available_kib allocatable_kib remaining_kib swap_kib swap_file
            available_kib="$(df --output=avail -k "$swap_dir" | tail -n 1 | tr -d ' ')"
            allocatable_kib=$((available_kib - reserve_kib))
            remaining_kib=$((target_swap_kib - created_swap_kib))
            if [ "$allocatable_kib" -le 0 ] || [ "$remaining_kib" -le 0 ]; then
              return
            fi
            swap_kib="$allocatable_kib"
            if [ "$swap_kib" -gt "$remaining_kib" ]; then
              swap_kib="$remaining_kib"
            fi
            if [ "$swap_kib" -lt $((1024 * 1024)) ]; then
              return
            fi
            swap_file="$swap_dir/$swap_name"
            sudo fallocate -l "${swap_kib}K" "$swap_file"
            sudo chmod 600 "$swap_file"
            sudo mkswap "$swap_file" >/dev/null
            sudo swapon --priority 100 "$swap_file"
            created_swap_kib=$((created_swap_kib + swap_kib))
          }

          runner_device="$(df --output=source "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')"
          if [ -d /mnt ]; then
            mnt_device="$(df --output=source /mnt | tail -n 1 | tr -d ' ')"
            if [ "$mnt_device" != "$runner_device" ]; then
              create_swap_file /mnt tokensbyte-build.swap $((2 * 1024 * 1024))
            fi
          fi
          create_swap_file "$RUNNER_TEMP" tokensbyte-build.swap $((10 * 1024 * 1024))

          if [ "$created_swap_kib" -lt "$minimum_swap_kib" ]; then
            echo "::error::Only $((created_swap_kib / 1024 / 1024)) GiB of additional swap could be created; 32 GiB is required"
            df -h
            exit 1
          fi
          sudo sysctl -w vm.swappiness=100
          df -h
          free -h
          swapon --show

      - name: Prepare amd64 backend binary
        run: |
          if [ -x backend/tokensbyte-server ]; then
            echo "using cached amd64 backend binary"
          else
            echo "backend binary cache miss; building from the checked-out source"
            free -h
            rustup component add rustc-codegen-cranelift-preview --toolchain nightly
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'exec flock "${RUNNER_TEMP:-/tmp}/tokensbyte-rustc.lock" "$@"' > "$RUNNER_TEMP/serial-rustc"
            chmod +x "$RUNNER_TEMP/serial-rustc"
            export RUSTC_WRAPPER="$RUNNER_TEMP/serial-rustc"
            export CARGO_INCREMENTAL=0
            export CARGO_PROFILE_RELEASE_CODEGEN_BACKEND=cranelift
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=0
            export CARGO_PROFILE_RELEASE_LTO=false
            export CARGO_PROFILE_RELEASE_DEBUG=false
            export RUSTFLAGS="-Zthreads=1 -Zmir-opt-level=0 -Zinline-mir=false -Zshare-generics=y -C codegen-units=256 -C opt-level=0 -C debuginfo=0 -C panic=abort -C linker=clang -C link-arg=-fuse-ld=lld"
            set +e
            cargo +nightly -Zcodegen-backend build \
              --manifest-path backend/Cargo.toml \
              --release --locked --config unstable.codegen-backend=true --bin tokensbyte-server -j 1 &
            build_pid=$!
            while kill -0 "$build_pid" 2>/dev/null; do
              sleep 30
              if kill -0 "$build_pid" 2>/dev/null; then
                echo "backend build still running ($(date -u '+%Y-%m-%dT%H:%M:%SZ'))"
                free -h
              fi
            done
            wait "$build_pid"
            build_status=$?
            set -e
            if [ "$build_status" -ne 0 ]; then
              exit "$build_status"
            fi
            cp backend/target/release/tokensbyte-server backend/tokensbyte-server
          fi
          test -x backend/tokensbyte-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/tokensbyte-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.thin
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tokensbyte-backend
          cache-to: type=gha,mode=max,scope=tokensbyte-backend

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/tokensbyte-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tokensbyte-frontend
          cache-to: type=gha,mode=max,scope=tokensbyte-frontend

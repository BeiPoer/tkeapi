name: Build & Push GHCR Images

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖与 mold 快速链接器
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang libssl-dev pkg-config

      - name: 配置 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: 🚀 宿主机安全编译后端二进制 (防 OOM 核心设置)
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
        run: |
          cd backend
          cargo build --release
          cp target/release/tokensbyte-server ./tokensbyte-server

      - name: 登录 GHCR 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 构建并推送后端镜像 (使用 Dockerfile.thin 极速打包)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.thin
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tokensbyte-backend:dev

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tokensbyte-frontend:dev
